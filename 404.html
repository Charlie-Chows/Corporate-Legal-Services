<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="STACKLY Legal — the page you are looking for could not be found.">
    <meta name="robots" content="noindex">
    <title>Page Not Found — STACKLY Legal</title>

    <link rel="stylesheet" href="global.css">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>

    <style>
        /* =========================================================
           404 — NOT FOUND
           ========================================================= */

        .notfound {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 170px 0 120px;
            background: var(--charcoal);
            color: var(--white);
            overflow: hidden;
        }

        .notfound::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(120% 90% at 78% 12%, rgba(148, 137, 121, .16) 0%, transparent 62%);
            pointer-events: none;
        }

        .notfound-inner {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: clamp(40px, 6vw, 100px);
            align-items: center;
        }

        /* ---------- Numeral ---------- */

        .notfound-code {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(110px, 16vw, 240px);
            font-weight: 400;
            line-height: .82;
            letter-spacing: -.06em;
            color: var(--taupe);
            user-select: none;
        }

        /* ---------- Copy ---------- */

        .notfound-copy-col {
            max-width: 620px;
        }

        .notfound .eyebrow {
            color: var(--ivory);
        }

        .notfound-title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(38px, 5vw, 72px);
            font-weight: 400;
            line-height: .98;
            letter-spacing: -.05em;
        }

        .notfound-title em {
            color: var(--ivory);
            font-style: italic;
        }

        .notfound-text {
            max-width: 500px;
            margin: 28px 0 0;
            color: rgba(248, 247, 243, .6);
            font-size: 15px;
            line-height: 1.85;
        }

        /* ---------- Actions ---------- */

        .notfound-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 40px;
        }

        .notfound-actions .btn-outline {
            color: var(--white);
            border-color: rgba(248, 247, 243, .38);
        }

        .notfound-actions .btn-outline:hover {
            background: var(--ivory);
            color: var(--charcoal);
            border-color: var(--ivory);
        }

        /* ---------- Quick links ---------- */

        .notfound-links {
            margin-top: 62px;
            padding-top: 26px;
            border-top: 1px solid var(--border-dark);
        }

        .notfound-links-label {
            display: block;
            margin-bottom: 18px;
            color: var(--taupe);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .notfound-links-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 28px;
        }

        .notfound-links-row a {
            position: relative;
            color: rgba(248, 247, 243, .72);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            transition: color .3s ease;
        }

        .notfound-links-row a::after {
            content: "";
            position: absolute;
            right: 0;
            bottom: -4px;
            left: 0;
            height: 1px;
            background: var(--ivory);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform .35s var(--ease);
        }

        .notfound-links-row a:hover {
            color: var(--ivory);
        }

        .notfound-links-row a:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        /* ---------- Responsive ---------- */

        @media (max-width: 900px) {
            .notfound-inner {
                grid-template-columns: 1fr;
                gap: 34px;
                justify-items: center;
                text-align: center;
            }

            .notfound-code {
                font-size: clamp(96px, 26vw, 170px);
            }

            .notfound-actions {
                justify-content: center;
            }
        }

        @media (max-width: 820px) {
            .notfound {
                padding: 130px 0 90px;
            }
        }

        @media (max-width: 560px) {
            .notfound {
                padding: 120px 0 80px;
            }

            .notfound-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .notfound-actions .btn {
                width: 100%;
            }

            .notfound-links-row {
                gap: 12px 22px;
            }
        }
    </style>
</head>

<body>

    <main>
        <!-- =================================================
             404 — PAGE NOT FOUND
             ================================================= -->
        <section class="section notfound" aria-labelledby="notfound-title">
            <div class="container">
                <div class="notfound-inner">

                    <div class="notfound-code reveal-left" aria-hidden="true">404</div>

                    <div class="notfound-copy-col">
                        <div class="eyebrow reveal-right">Error / Page Not Found</div>

                        <h1 class="notfound-title reveal-right" id="notfound-title">
                            This page has<br>been <em>withdrawn.</em>
                        </h1>

                        <p class="notfound-text reveal-right">
                            The page you are looking for has either been moved, renamed,
                            or never existed. Nothing has been lost — use the links below
                            to return to familiar ground.
                        </p>

                        <div class="notfound-actions reveal-right">
                            <a class="btn btn-light" href="index.html">Back to Home</a>
                            <button class="btn btn-outline" type="button" id="goBackBtn">Go Back</button>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>


    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            /* ---------- Entrance ---------- */
            if (!reducedMotion && window.gsap) {
                gsap.timeline({ defaults: { ease: "power4.out" } })
                    .from(".notfound-code", { y: 60, opacity: 0, duration: 1 })
                    .from(".notfound .eyebrow", { x: 30, opacity: 0, duration: .6 }, "-=.7")
                    .from(".notfound-title", { y: 40, opacity: 0, duration: .9 }, "-=.55")
                    .from(".notfound-text", { y: 24, opacity: 0, duration: .7 }, "-=.6")
                    .from(".notfound-actions", { y: 20, opacity: 0, duration: .6 }, "-=.5")
                    .from(".notfound-links", { y: 20, opacity: 0, duration: .6 }, "-=.45");
            }

            /* ---------- Go back button ---------- */
            const goBackBtn = document.getElementById("goBackBtn");
            if (goBackBtn) {
                goBackBtn.addEventListener("click", () => {
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = "index.html";
                    }
                });
            }
        });
    </script>
</body>

</html>
